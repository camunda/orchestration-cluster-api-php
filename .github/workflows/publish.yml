name: Publish

on:
  push:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      spec_ref:
        description: 'Git ref (branch/tag/SHA) in camunda/camunda to fetch spec from'
        required: false
        default: 'stable/8.10'

concurrency:
  group: orchestration-cluster-api-php-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  spec-ref-guard:
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.10' }}
      default-ref: 'stable/8.10'
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  bundle-spec:
    needs: spec-ref-guard
    uses: camunda/sdk-infra/.github/workflows/sdk-bundle-spec.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'stable/8.10' }}

  release:
    needs: bundle-spec
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pcntl, mbstring
          coverage: none
          tools: composer:v2

      - name: Set up Java (openapi-generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Clear checked-in spec (prevent stale fallback)
        run: rm -rf external-spec/bundled/*

      - name: Download bundled spec
        uses: actions/download-artifact@v8
        with:
          name: bundled-spec
          path: external-spec/bundled/

      - name: Generate SDK
        run: make generate-only

      - name: Run acceptance tests
        run: make test

      - name: Static analysis (PHPStan max)
        run: make phpstan

      # Packagist resolves versions from git tags; semantic-release stamps
      # src/Version.php and pushes the tag (see release.config.cjs).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
