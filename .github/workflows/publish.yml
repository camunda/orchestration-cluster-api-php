name: Publish

on:
  push:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      spec_ref:
        description: 'Git ref (branch/tag/SHA) in camunda/camunda to fetch spec from'
        required: false
        default: 'main'
      api_break_approved:
        description: >-
          Release even though the public API breaks compatibility with the last release on
          this stable branch (for a break no labelled PR covers, e.g. a direct push).
        type: boolean
        default: false

concurrency:
  group: orchestration-cluster-api-php-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spec-ref-guard:
    uses: camunda/sdk-infra/.github/workflows/sdk-spec-ref-guard.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'main' }}
      default-ref: 'main'
      ack: ${{ vars.SPEC_REF_OVERRIDE_ACK || '' }}
      expires: ${{ vars.SPEC_REF_OVERRIDE_EXPIRES || '' }}

  bundle-spec:
    needs: spec-ref-guard
    uses: camunda/sdk-infra/.github/workflows/sdk-bundle-spec.yml@v1
    with:
      spec-ref: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.spec_ref) || vars.SPEC_REF_OVERRIDE || 'main' }}

  # Blocks a stable/** release whose public API breaks compatibility with the newest N.x
  # release on Packagist, unless approved: the api-break-approved label on a PR merged into
  # the branch since that release, or the api_break_approved input of a manual run. It
  # checks the committed HEAD, which is what the release tags (semantic-release commits only
  # CHANGELOG.md and src/Version.php; the release job's regeneration never ships). A
  # separate job because the checker needs PHP 8.4+. A no-op on main, whose prereleases
  # make no compatibility promise. See scripts/api-compat-release-gate.sh.
  api-compat:
    name: API compatibility gate
    needs: spec-ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # find the PRs merged since the baseline and their labels
    steps:
      - uses: actions/checkout@v6
        if: startsWith(github.ref_name, 'stable/')
        with:
          # Tags and history: the baseline release and the PRs merged since it.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        if: startsWith(github.ref_name, 'stable/')
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # roave/backward-compatibility-check needs 8.4+
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install checker
        if: startsWith(github.ref_name, 'stable/')
        run: composer install --working-dir=tools/api-compat --no-interaction --no-progress

      - name: Check API compatibility
        if: startsWith(github.ref_name, 'stable/')
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          DISPATCH_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.api_break_approved }}
        run: bash scripts/api-compat-release-gate.sh

  release:
    needs: [bundle-spec, api-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # mint GitHub OIDC token for Vault JWT auth
    steps:
      # semantic-release pushes the release commit and tag to a ruleset-protected
      # branch. GITHUB_TOKEN can never bypass a ruleset, so the release runs as the
      # camunda-sdk-automation GitHub App, which is a bypass actor on the main and
      # stable/** rulesets (same setup as the other orchestration-cluster-api SDKs).
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure committer identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          # semantic-release sets default GIT_AUTHOR_*/GIT_COMMITTER_* env vars that
          # override git config, so export the app identity explicitly.
          {
            echo "GIT_AUTHOR_NAME=${APP_SLUG}[bot]"
            echo "GIT_AUTHOR_EMAIL=${APP_SLUG}[bot]@users.noreply.github.com"
            echo "GIT_COMMITTER_NAME=${APP_SLUG}[bot]"
            echo "GIT_COMMITTER_EMAIL=${APP_SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_ENV"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pcntl, mbstring
          coverage: none
          tools: composer:v2

      - name: Set up Java (openapi-generator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Fetch openapi-generator jar (retried)
        run: bash scripts/fetch-openapi-generator.sh

      - name: Clear checked-in spec (prevent stale fallback)
        run: rm -rf external-spec/bundled/*

      - name: Download bundled spec
        uses: actions/download-artifact@v8
        with:
          name: bundled-spec
          path: external-spec/bundled/

      - name: Generate SDK
        run: make generate-only

      - name: Run acceptance tests
        run: make test

      - name: Static analysis (PHPStan max)
        run: make phpstan

      # Packagist resolves versions from git tags; semantic-release stamps
      # src/Version.php and pushes the tag (see release.config.cjs). On success
      # scripts/notify-packagist.sh pings the Packagist update-package API so the
      # new version syncs immediately — requires the PACKAGIST_* credentials below.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          # SDK major tracks the Camunda server minor: main builds camunda main (8.11 -> 11.0.0-alpha.N),
          # stable/10 builds camunda stable/8.10 (-> 10.x).
          # Consumed by @camunda8/sdk-infra release.config.base.cjs to pick the promoted
          # stable major (dist-tag `latest`) and align main's alpha prereleases.
          CAMUNDA_SDK_CURRENT_STABLE_MAJOR: ${{ vars.CAMUNDA_SDK_CURRENT_STABLE_MAJOR }}
        run: npx semantic-release
